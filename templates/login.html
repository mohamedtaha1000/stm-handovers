{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block shell %}
<div class="login-wrap">
  <div class="login-inner">
    <div class="login-logo">
      <img src="{{ url_for('static', filename='stm-wordmark.png') }}" alt="STM">
      <span>Handover Documents</span>
    </div>
    <div class="card">
      <h1>Sign in</h1>
      <p class="subtitle">Sign in with your STM account.</p>
      {% if error %}
      <div class="flash error">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
        <p>{{ error }}</p>
      </div>
      {% endif %}
      <form method="post">
        <div class="field">
          <label for="username">Username</label>
          <input id="username" type="text" name="username" required autofocus autocomplete="username">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" name="password" required autocomplete="current-password" placeholder="••••••••">
        </div>
        <button type="submit" class="full"
                data-tip="Your account is recorded against every document you make, so the history shows who did what.">Log in</button>
      </form>
    </div>
    <p class="login-note">STM internal tool · documents never leave the office network</p>
  </div>
</div>
{% endblock %}
